server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID}
            client-secret: ${OAUTH_GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_GMAIL}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${POSTGRES_REGISTRATION_DOCKER_URL:jdbc:postgresql://localhost:5432/registration_db}
    password: 1234
    username: user
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${REDIS_DOCKER_HOST:localhost}
      port: 6379
      timeout: 500ms

  kafka:
    bootstrap-servers: ${KAFKA_DOCKER_URL:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

jasypt:
  encryptor:
    password: ${JASYPT_KEY}

minio:
  url: ${MINIO_DOCKER_URL}
  bucket: user-sessions
  user: user
  password: 1234